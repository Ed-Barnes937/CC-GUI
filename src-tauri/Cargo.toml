[package]
name = "cc-gui"
version = "0.12.0"
edition = "2021"
description = "GUI for claude-commander"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = "1"

# Pinned to a published claude-commander release for reproducible builds. To
# develop against a local checkout instead, add a gitignored `.cargo/config.toml`
# with `paths = ["../claude-commander"]` — see CONTRIBUTING.md.
#
# `default-features = false` drops CC's `audio` feature (rodio/cpal), which since
# CC v0.26.0 links PipeWire (libspa-sys) on Linux and needs libpipewire dev
# headers we don't ship in CI. The GUI never uses CC's in-process audio; we keep
# `clipboard` for the embedded TUI's clipboard support.
claude-commander-core = { git = "https://github.com/sizeak/claude-commander", tag = "v0.32.0", default-features = false, features = [
    "clipboard",
] }
futures = "0.3.32"
tracing = "0.1.44"
chrono = "0.4.45"

[dev-dependencies]
tempfile = "3"
